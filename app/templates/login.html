{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-card">
  <h1>EMS Licensure Dashboard</h1>
  <p class="muted">Bexar County 2 Fire Department</p>
  <form method="post">
    <label>Username
      <input type="text" name="username" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
